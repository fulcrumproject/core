ErrorRes:
  type: object
  required:
    - status
    - message
  properties:
    status:
      type: integer
      description: HTTP status code
      example: 400
    message:
      type: string
      description: Human-readable error message
      example: "provider with ID '123e4567-e89b-12d3-a456-426614174000' does not exist"
    template:
      type: string
      description: >-
        Message template with {placeholder} tokens, present only when the
        message was interpolated from structured data (enables client-side
        localization).
      example: "provider with ID {providerId} does not exist"
    data:
      type: object
      additionalProperties: true
      description: Interpolation values for the template placeholders
      example:
        providerId: "123e4567-e89b-12d3-a456-426614174000"

properties.UUID:
  type: string
  format: uuid
  example: "123e4567-e89b-12d3-a456-426614174000"

JSONObject:
  type: object
  additionalProperties: true
  description: A generic properties.JSON object

PageRes:
  type: object
  properties:
    items:
      type: array
      items:
        type: object
    totalItems:
      type: integer
      format: int64
      description: Total number of items across all pages
    totalPages:
      type: integer
      description: Total number of pages
    currentPage:
      type: integer
      description: Current page number
    hasNext:
      type: boolean
      description: Whether there is a next page
    hasPrev:
      type: boolean
      description: Whether there is a previous page

ValidationErrorDetail:
  type: object
  required:
    - path
    - message
  properties:
    path:
      type: string
      description: The property path that failed validation
      example: "cpu"
    message:
      type: string
      description: The validation error message
      example: "value not in allowed enum values 1, 2, 4, 8, 16, 32"
    template:
      type: string
      description: >-
        Message template with {placeholder} tokens, present only when the
        message was interpolated from structured data.
      example: "value not in allowed enum values {values}"
    data:
      type: object
      additionalProperties: true
      description: Interpolation values for the template placeholders
      example:
        values: [1, 2, 4, 8, 16, 32]

ValidationErrRes:
  type: object
  required:
    - status
    - message
    - errors
  properties:
    status:
      type: integer
      description: HTTP status code
      example: 400
    message:
      type: string
      description: Human-readable summary of the failure
      example: "validation failed"
    errors:
      type: array
      items:
        $ref: "#/ValidationErrorDetail"
      description: Array of validation errors with detailed information about each failure
      minItems: 1
