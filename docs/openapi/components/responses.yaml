BadRequest:
  description: Bad Request
  content:
    application/json:
      schema:
        $ref: "./schemas/common.yaml#/ErrorRes"
ValidationErrors:
  description: Validation errors - request contains invalid or missing required fields
  content:
    application/json:
      schema:
        $ref: "./schemas/common.yaml#/ValidationErrRes"
      example:
        status: 400
        message: "validation failed"
        errors:
          - path: "cpu"
            message: "value not in allowed enum values 1, 2, 4, 8, 16, 32"
            template: "value not in allowed enum values {values}"
            data:
              values: [1, 2, 4, 8, 16, 32]
          - path: "memory"
            message: "property is required"
Unauthorized:
  description: Unauthorized
  content:
    application/json:
      schema:
        $ref: "./schemas/common.yaml#/ErrorRes"
Forbidden:
  description: Forbidden
  content:
    application/json:
      schema:
        $ref: "./schemas/common.yaml#/ErrorRes"
Conflict:
  description: Conflict - the request conflicts with the current state of the resource
  content:
    application/json:
      schema:
        $ref: "./schemas/common.yaml#/ErrorRes"
InternalServerError:
  description: Internal Server Error
  content:
    application/json:
      schema:
        $ref: "./schemas/common.yaml#/ErrorRes"
